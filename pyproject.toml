[project]
name = "glyphs-unicodeinfo"
version = "1.3.0"
description = "Unicode information window for Glyphs"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jens Kutílek", email = "webmail@kutilek.de" }]

dependencies = [
  "cocoa-vanilla >= 0.8.0",
  "jkunicode >= 2.7.0",
  "pyobjc",
]

[dependency-groups]
dev = [
  "mypy >= 2.4.0",
  "ruff >= 0.17.3",
]
test = [
  "pytest-cov >= 7.1.0",
  "pytest >= 9.2.0",
  "tox-gh >= 1.9.1",
  "tox-uv >= 1.37.2",
  "tox >= 4.67.4",
  { include-group = "dev" },
]

[tool.ruff.lint]
future-annotations = false
ignore = ["N999"]
